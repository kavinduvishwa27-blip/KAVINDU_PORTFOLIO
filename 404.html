<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost Beyond the Horizon — 404</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#030203" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #e9c58c; --ember: #ff8a3d; --ink: #f4ede3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #030203; color: var(--ink); font-family: 'JetBrains Mono', monospace; text-align: center; padding: 24px 16px; overflow: hidden; }
    .hole { width: 160px; height: 160px; margin: 0 auto 40px; border-radius: 50%; background: #000; position: relative; box-shadow: 0 0 0 3px rgba(255,225,180,.9), 0 0 50px 12px rgba(255,138,61,.55), 0 0 160px 50px rgba(255,120,40,.18); animation: pulse 3s ease-in-out infinite; }
    .hole::after { content: ''; position: absolute; inset: -18% -95%; border-radius: 50%; border: 3px solid rgba(255,170,90,.6); transform: rotateX(78deg) rotate(-8deg); box-shadow: 0 0 24px rgba(255,138,61,.6); }
    @keyframes pulse { 50% { transform: scale(.94); } }
    h1 { font: 800 clamp(64px, 16vw, 150px)/.9 'Bricolage Grotesque', sans-serif; letter-spacing: -.05em; margin: 0 0 16px; background: linear-gradient(100deg, #fff1d6, var(--gold) 45%, var(--ember)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: rgba(244,237,227,.6); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; margin: 0 0 34px; line-height: 1.8; }
    a { display: inline-block; padding: 15px 24px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; transition: background .3s, color .3s; }
    a:hover { background: var(--gold); color: #140a04; }
  </style>
</head>
<body>
  <main>
    <div class="hole" aria-hidden="true"></div>
    <h1>404</h1>
    <p>This page crossed the event horizon.<br/>Nothing comes back out — except you.</p>
    <a href="./">← Return to the portfolio</a>
  </main>
</body>
</html>
